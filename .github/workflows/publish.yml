name: Publish

# Runs when a GitHub release is published (created by hand: Releases → Draft a new release,
# tag vX.Y.Z on main). Builds the backend and nginx images from the tagged commit, pushes them
# to GHCR as X.Y.Z, X.Y and latest, and publishes the Helm chart with the same version.
# Nothing is deployed: production runs the version set in the Argo CD Application in the
# infrastructure repo, which the owner updates by hand.
#
# Runs on GitHub-hosted runners (ubuntu-latest), not the self-hosted ones.

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
    steps:
      - name: Version from the release tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::release tag must look like vX.Y.Z (got '$TAG')"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
          - image: nginx
            context: .
            file: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          push: true
          # Shown in the app (footer, /api/v1/meta).
          build-args: APP_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.version.outputs.minor }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          # Same cache scopes as CI, so unchanged layers are reused.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  chart:
    name: Helm chart
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish Helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/korinnia --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/korinnia-$VERSION.tgz" "$CHART_REPO"

      - name: Summary
        run: |
          {
            echo "## Korinnia v$VERSION"
            echo ""
            echo "| Artifact | Reference |"
            echo "| --- | --- |"
            echo "| Backend image | \`$IMAGE_PREFIX/backend:$VERSION\` |"
            echo "| nginx image | \`$IMAGE_PREFIX/nginx:$VERSION\` |"
            echo "| Helm chart | \`$CHART_REPO/korinnia --version $VERSION\` |"
            echo "| Built from | \`$GITHUB_SHA\` |"
            echo ""
            echo "To deploy: set this version in the Argo CD Application in the infrastructure repo."
          } >> "$GITHUB_STEP_SUMMARY"
