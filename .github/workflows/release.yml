name: Release

# Cuts a version: promotes the images CI built and tested (sha-<commit>; the newest commit
# with images, as long as nothing after it changed the app code) to X.Y.Z, publishes the
# Helm chart as an OCI artifact with the same version, and tags the commit vX.Y.Z with a
# GitHub release. The version is either given explicitly or bumped from the latest tag. Argo CD (sandbox repo) deploys the chart
# version pinned in its Application; Renovate opens a PR there when a new chart is published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to release (X.Y.Z, e.g. 0.0.1). Leave empty to bump instead.
        required: false
        default: ""
        type: string
      bump:
        description: Which part of the latest version to increase (ignored when version is set)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write  # tag + GitHub release
  packages: write  # image tags + chart

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release:
    name: Release
    runs-on: korinnia-runners
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # all tags

      - name: Next version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          if [ -n "$VERSION_INPUT" ]; then
            if ! [[ "${VERSION_INPUT#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like X.Y.Z (got '$VERSION_INPUT')"; exit 1
            fi
            IFS=. read -r major minor patch <<< "${VERSION_INPUT#v}"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
          fi
          version="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          echo "Releasing $last -> v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=$major.$minor" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Commits that don't touch the image sources (workflows, chart, docs) reuse the images
      # of the newest tested commit before them, so they can be released without waiting for
      # CI. A commit that changes app code must have its own images first.
      - name: Find tested images
        id: images
        run: |
          image_paths=(backend frontend deploy/nginx)
          has_images() {
            for img in backend nginx; do
              docker buildx imagetools inspect "$IMAGE_PREFIX/$img:sha-${1::7}" >/dev/null 2>&1 || return 1
            done
          }
          for commit in $(git rev-list --max-count=50 "$GITHUB_SHA"); do
            if has_images "$commit"; then
              echo "Using images of ${commit::7}"
              echo "sha=sha-${commit::7}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$(git diff-tree --no-commit-id --name-only -r "$commit" -- "${image_paths[@]}")" ]; then
              echo "::error::${commit::7} changes ${image_paths[*]} but has no images yet — wait for CI on it to pass"
              exit 1
            fi
            echo "${commit::7} does not change the images, looking further back"
          done
          echo "::error::No tested images found in the last 50 commits"
          exit 1

      - name: Promote tested images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MINOR: ${{ steps.version.outputs.minor }}
          sha: ${{ steps.images.outputs.sha }}
        run: |
          for img in backend nginx; do
            docker buildx imagetools create \
              -t "$IMAGE_PREFIX/$img:$VERSION" \
              -t "$IMAGE_PREFIX/$img:$MINOR" \
              -t "$IMAGE_PREFIX/$img:latest" \
              "$IMAGE_PREFIX/$img:$sha"
          done

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Publish Helm chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/korinnia --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/korinnia-$VERSION.tgz" "$CHART_REPO"

      - name: Tag and create GitHub release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGES_FROM: ${{ steps.images.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # REST API instead of the gh CLI, which the self-hosted runner image does not ship.
          # Creates the tag on the commit as well.
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"v$VERSION\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"v$VERSION\",\"generate_release_notes\":true}" \
            > /dev/null
          {
            echo "## Korinnia v$VERSION"
            echo ""
            echo "| Artifact | Reference |"
            echo "| --- | --- |"
            echo "| Backend image | \`$IMAGE_PREFIX/backend:$VERSION\` |"
            echo "| nginx image | \`$IMAGE_PREFIX/nginx:$VERSION\` |"
            echo "| Helm chart | \`$CHART_REPO/korinnia --version $VERSION\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Images built from | \`$IMAGES_FROM\` |"
          } >> "$GITHUB_STEP_SUMMARY"
