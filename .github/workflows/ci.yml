name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: korinnia-runners
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: korinnia
          POSTGRES_PASSWORD: korinnia
          POSTGRES_DB: korinnia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U korinnia" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: korinnia
      POSTGRES_PASSWORD: korinnia
      POSTGRES_DB: korinnia_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: korinnia-runners
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  chart:
    name: Helm chart — lint, render
    runs-on: korinnia-runners
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - run: |
          helm lint deploy/helm/korinnia --strict \
            --set secrets.secretKey=ci --set database.password=ci
          helm template korinnia deploy/helm/korinnia \
            --set secrets.secretKey=ci --set database.password=ci --set ingress.enabled=true > /dev/null

  images-e2e:
    name: Docker images + end-to-end tests
    runs-on: korinnia-runners
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write  # push images on main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Self-hosted ARC runner image ships the docker CLI + buildx but not the compose plugin
      - uses: docker/setup-compose-action@2fe291b7677a45ee1269ec56a42604c143505e7e # v1.3.0
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: prod
          tags: korinnia/backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build nginx image (includes frontend build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/nginx/Dockerfile
          target: prod
          tags: korinnia/nginx:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
      - name: Start production stack
        run: |
          cp .env.example .env
          echo "ENVIRONMENT=production" >> .env
          docker compose -f docker-compose.yml up -d --no-build --wait
          docker compose -f docker-compose.yml exec -T backend python -m app.seed
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml logs
      # Only images that passed the e2e tests are published. Releases (release.yml) promote
      # these sha-<commit> images to a version tag without rebuilding them.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
