name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: korinnia
          POSTGRES_PASSWORD: korinnia
          POSTGRES_DB: korinnia_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U korinnia" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: korinnia
      POSTGRES_PASSWORD: korinnia
      POSTGRES_DB: korinnia_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.15
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80

  frontend:
    name: Frontend — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  chart:
    name: Helm chart — lint, render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: |
          helm lint deploy/helm/korinnia --strict \
            --set secrets.secretKey=ci --set database.password=ci
          helm template korinnia deploy/helm/korinnia \
            --set secrets.secretKey=ci --set database.password=ci --set ingress.enabled=true > /dev/null

  images-e2e:
    name: Docker images + end-to-end tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: prod
          tags: korinnia/backend:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build nginx image (includes frontend build)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/nginx/Dockerfile
          target: prod
          tags: korinnia/nginx:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx
      # Fails on CRITICAL vulnerabilities that already have a fix (an unfixed CVE would block CI
      # with nothing to do but wait). The full table is in the step log.
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: korinnia/backend:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan nginx image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: korinnia/nginx:latest
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start production stack
        run: |
          cp .env.example .env
          echo "ENVIRONMENT=production" >> .env
          # Same settings as `make test-e2e`: the tests are written against the Ukrainian UI,
          # and test accounts don't need their own demo family.
          sed -i -e 's/^DEFAULT_LANGUAGE=.*/DEFAULT_LANGUAGE=uk/' \
            -e 's/^DEMO_TREE_FOR_NEW_USERS=.*/DEMO_TREE_FOR_NEW_USERS=false/' \
            -e 's/^DEMO_LOGIN_ENABLED=.*/DEMO_LOGIN_ENABLED=true/' .env
          docker compose -f docker-compose.yml up -d --no-build --wait
          docker compose -f docker-compose.yml exec -T backend python -m app.seed
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml logs
