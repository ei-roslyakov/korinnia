name: Build images

# Builds and pushes the backend and nginx images for the selected commit, without the CI
# test suite. Tags match CI (sha-<commit>), so the Release workflow can promote them right
# away. Use when waiting for the full CI run is not worth it; the images are untested.

on:
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: korinnia-runners
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
          - image: nginx
            context: .
            file: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "branch=$(echo "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9._\n-' '-')" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.tags.outputs.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.tags.outputs.branch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Same cache scopes as CI, so unchanged layers are reused.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Summary
        run: echo "- \`$IMAGE_PREFIX/${{ matrix.image }}:${{ steps.tags.outputs.sha }}\` (untested)" >> "$GITHUB_STEP_SUMMARY"
