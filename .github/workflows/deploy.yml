name: Deploy

# Builds and pushes the images for the current main commit, publishes the Helm chart, tags
# vX.Y.Z with a GitHub release, then writes X.Y.Z into the Argo CD Application
# (deploy/argocd/infra-k8s-001/korinnia.yaml) and pushes that change. Argo CD picks it up
# from git. Images are not run through the CI test suite here.
#
# Runs on every push to main (patch bump) or manually (explicit version or bump).
# No loop: the version commit is pushed with GITHUB_TOKEN (pushes made with it never start
# workflows), carries [skip ci], and only touches deploy/argocd/ (ignored below).

on:
  push:
    branches: [main]
    paths-ignore:
      - "deploy/argocd/**" # Application edits are applied by Argo CD directly
      - "**/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: Exact version to deploy (X.Y.Z). Leave empty to bump instead.
        required: false
        default: ""
        type: string
      bump:
        description: Which part of the latest version to increase (ignored when version is set)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts
  APP_MANIFEST: deploy/argocd/infra-k8s-001/korinnia.yaml

jobs:
  version:
    name: Version
    runs-on: korinnia-runners
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all tags
      - name: Next version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP: ${{ inputs.bump || 'patch' }} # push events have no inputs
        run: |
          last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          if [ -n "$VERSION_INPUT" ]; then
            if ! [[ "${VERSION_INPUT#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must look like X.Y.Z (got '$VERSION_INPUT')"; exit 1
            fi
            IFS=. read -r major minor patch <<< "${VERSION_INPUT#v}"
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              patch) patch=$((patch + 1)) ;;
            esac
          fi
          version="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          echo "Deploying $last -> v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    needs: version
    runs-on: korinnia-runners
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            context: backend
            file: backend/Dockerfile
          - image: nginx
            context: .
            file: deploy/nginx/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: prod
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ steps.sha.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          # Same cache scopes as CI, so unchanged layers are reused.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    name: Publish and deploy
    needs: [version, build]
    runs-on: korinnia-runners
    permissions:
      contents: write # tag, GitHub release, version commit
      packages: write # chart
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish Helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/korinnia --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/korinnia-$VERSION.tgz" "$CHART_REPO"

      - name: Tag and create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # REST API instead of the gh CLI, which the self-hosted runner image does not ship.
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"v$VERSION\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"v$VERSION\",\"generate_release_notes\":true}" \
            > /dev/null

      - name: Write version into the Argo CD Application and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may have moved since the build started: apply the change on its tip.
          git fetch origin main
          git checkout -B main origin/main
          for attempt in 1 2 3; do
            sed -i -E \
              -e "s/^([[:space:]]*targetRevision: )\"[^\"]*\"( # set by Deploy)$/\1\"$VERSION\"\2/" \
              -e "s/^([[:space:]]*tag: )\"[^\"]*\"( # set by Deploy)$/\1\"$VERSION\"\2/" \
              "$APP_MANIFEST"
            updated=$(grep -c "\"$VERSION\" # set by Deploy" "$APP_MANIFEST" || true)
            if [ "$updated" -ne 3 ]; then
              echo "::error::expected 3 '# set by Deploy' lines in $APP_MANIFEST, updated $updated"; exit 1
            fi
            git add "$APP_MANIFEST"
            git commit -m "Deploy v$VERSION [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt), rebasing on the new main"
            git fetch origin main
            git reset --hard origin/main
          done
          echo "::error::could not push the version commit"; exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Korinnia v$VERSION"
            echo ""
            echo "| Artifact | Reference |"
            echo "| --- | --- |"
            echo "| Backend image | \`$IMAGE_PREFIX/backend:$VERSION\` |"
            echo "| nginx image | \`$IMAGE_PREFIX/nginx:$VERSION\` |"
            echo "| Helm chart | \`$CHART_REPO/korinnia --version $VERSION\` |"
            echo "| Built from | \`$GITHUB_SHA\` |"
            echo "| Argo CD app | \`$APP_MANIFEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
