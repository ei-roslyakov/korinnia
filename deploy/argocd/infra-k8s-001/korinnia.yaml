# Korinnia on infra-k8s-001. Loaded by the infra-k8s-001-korinnia-apps Application in the
# sandbox repo (which watches this folder). The Deploy workflow rewrites the version lines
# marked "set by Deploy" and commits with [skip ci].
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-k8s-001-korinnia
  namespace: argo-main
spec:
  project: infra-k8s-001-infrastructure-main
  source:
    # Published by the Deploy / Release workflows (private GHCR; credentials: ghcr-charts repo secret)
    repoURL: ghcr.io/ei-roslyakov/charts
    chart: korinnia
    targetRevision: "0.0.7" # set by Deploy
    helm:
      valuesObject:
        image:
          backend:
            tag: "0.0.7" # set by Deploy
          nginx:
            tag: "0.0.7" # set by Deploy

        imagePullSecrets:
          - name: infra-k8s-001-korinnia-ghcr-pull

        config:
          publicBaseUrl: https://korinnia.app
          cookieSecure: true
          workerConcurrency: 2
          extraEnv:
            DEMO_TREE_FOR_NEW_USERS: "true"

        database:
          host: infra-k8s-001-common-pg-db-rw.infra-k8s-001-db.svc.cluster.local
          port: 5432
          name: korinnia-db
          user: korinnia-db
          existingSecret: infra-k8s-001-korinnia-db
          passwordKey: password

        secrets:
          existingSecret: infra-k8s-001-korinnia

        persistence:
          storageClass: nfs-csi
          accessMode: ReadWriteMany
          size: 50Gi

        nodeSelector:
          kubernetes.io/arch: amd64

        ingress:
          enabled: true
          className: nginx
          host: korinnia.app
          extraHosts:
            - korinnia.rosliakov.club
          annotations:
            # Large photo/video uploads, streamed straight to the backend.
            nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
            nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

  destination:
    server: https://kubernetes.default.svc
    namespace: infra-k8s-001-korinnia

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
