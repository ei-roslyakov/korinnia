# Development: proxy to the Vite dev server (hot reload over WebSocket).
# Mounted over frontend.conf by docker-compose.override.yml.

# Vite's live-reload WebSocket (server.hmr.path in vite.config.ts). This is the only
# location that upgrades, and only ever to "websocket": other Upgrade values such as "h2c"
# are never forwarded, which prevents request smuggling past nginx.
location = /__vite_hmr {
    proxy_pass http://frontend:5173;
    # Reviewed: this is the mitigation the h2c rule asks for (Upgrade is only ever the fixed
    # value "websocket", on this one path); development only, never in the production image.
    proxy_http_version 1.1;  # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
    proxy_set_header Host $host;
    proxy_set_header Upgrade websocket;
    proxy_set_header Connection upgrade;
    proxy_read_timeout 1h;
}

location / {
    proxy_pass http://frontend:5173;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Vite injects an inline React Refresh preamble and uses a WebSocket for HMR.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
