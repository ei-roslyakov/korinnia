# Korinnia Helm chart. All application settings are environment variables (see .env.example).

image:
  registry: ghcr.io
  backend:
    repository: ei-roslyakov/korinnia/backend
    # Defaults to the chart's appVersion.
    tag: ""
  nginx:
    repository: ei-roslyakov/korinnia/nginx
    tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
#  - name: ghcr-pull

nameOverride: ""
fullnameOverride: ""

# --- Application settings ---------------------------------------------------------------
config:
  environment: production
  logLevel: INFO
  # Public URL of the app, used in invitation / password-reset links.
  publicBaseUrl: https://korinnia.example.com
  # Auth cookies get the Secure flag; keep true behind TLS.
  cookieSecure: true
  maxUploadSizeMb: 2048
  workerConcurrency: 2
  # Give every new account its own copy of the fictional demo family (66 people). Turn off
  # once the real family archive is in use, if new members should not get it.
  demoTreeForNewUsers: true
  # Interface language for visitors who have not chosen one and for new accounts: en, uk, pl.
  defaultLanguage: en
  # Extra plain environment variables for backend and worker.
  extraEnv: {}

# --- Database (external PostgreSQL 16, e.g. a CloudNativePG cluster) ----------------------
database:
  host: postgres
  port: 5432
  name: korinnia
  user: korinnia
  # Secret holding the password (a CNPG basic-auth secret works as is).
  existingSecret: ""
  passwordKey: password
  # Only used when existingSecret is empty (development; prefer existingSecret).
  password: ""

# --- Secrets ----------------------------------------------------------------------------
# Either point at an existing Secret with the keys below, or let the chart create one.
secrets:
  existingSecret: ""
  keys:
    secretKey: secret-key
    superadminEmail: superadmin-email
    superadminPassword: superadmin-password
  # Only used when existingSecret is empty.
  secretKey: ""
  superadminEmail: ""
  superadminPassword: ""

# --- Media volume (shared by backend, worker and nginx -> ReadWriteMany) -------------------
persistence:
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteMany
  size: 20Gi
  # Never delete the media volume together with the release.
  keep: true
  # Before each pod starts, an init container (as root) makes the volume's top folder
  # group-writable for the app (gid 1000). Some provisioners reset it on every mount, e.g.
  # csi-driver-nfs with `mountPermissions: "0755"`, so fsGroup alone is not enough.
  # Needs an NFS export without root_squash; disable if your storage handles it.
  fixPermissions: true

# --- Components -------------------------------------------------------------------------
backend:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # ffmpeg transcodes video; give it room.
      cpu: "2"
      memory: 2Gi

nginx:
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 500m
      memory: 256Mi

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# Every app container (backend, worker, nginx). Each also runs as its image's user: 1000 for
# backend and worker, 101 for nginx. Writable paths are emptyDirs (/tmp; nginx also conf.d).
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# The app never calls the Kubernetes API.
automountServiceAccountToken: false

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: korinnia.example.com
  # Additional hostnames serving the same app (config.publicBaseUrl stays the primary one).
  extraHosts: []
  tls: []
  #  - secretName: korinnia-tls
  #    hosts: [korinnia.example.com]

# --- Network policies -------------------------------------------------------------------
# None by default: each entry becomes a NetworkPolicy named <fullname>-<key>. Select pods with
# `components` (backend, worker, nginx of this release) or a plain `podSelector`; neither selects
# every pod in the namespace. policyTypes, ingress and egress are the NetworkPolicy fields as is.
# Needs a CNI that enforces NetworkPolicy (e.g. Cilium, Calico; not Flannel).
networkPolicies: {}
