{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "korinnia.secretName" . }}
  labels:
    {{- include "korinnia.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.secrets.keys.secretKey }}: {{ required "secrets.secretKey (or secrets.existingSecret) is required" .Values.secrets.secretKey | quote }}
  {{- with .Values.secrets.superadminEmail }}
  {{ $.Values.secrets.keys.superadminEmail }}: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.superadminPassword }}
  {{ $.Values.secrets.keys.superadminPassword }}: {{ . | quote }}
  {{- end }}
{{- end }}
{{- if not .Values.database.existingSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "korinnia.dbSecretName" . }}
  labels:
    {{- include "korinnia.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.passwordKey }}: {{ required "database.password (or database.existingSecret) is required" .Values.database.password | quote }}
{{- end }}
