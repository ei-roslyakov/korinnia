apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "korinnia.fullname" . }}-worker
  labels:
    {{- include "korinnia.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "korinnia.selectorLabels" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "korinnia.selectorLabels" (list . "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "korinnia.mediaPermissionsInit" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "korinnia.image" (list . .Values.image.backend) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Needs the job-queue schema from the backend's migrations; restarts until it exists.
          args: ["worker"]
          envFrom:
            - configMapRef:
                name: {{ include "korinnia.fullname" . }}-config
          env:
            {{- include "korinnia.backendEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          volumeMounts:
            - name: media
              mountPath: /data/media
      volumes:
        {{- include "korinnia.mediaVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
