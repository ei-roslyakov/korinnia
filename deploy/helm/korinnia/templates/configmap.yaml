apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "korinnia.fullname" . }}-config
  labels:
    {{- include "korinnia.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.config.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PUBLIC_BASE_URL: {{ .Values.config.publicBaseUrl | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  MAX_UPLOAD_SIZE_MB: {{ .Values.config.maxUploadSizeMb | quote }}
  WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  DEMO_TREE_FOR_NEW_USERS: {{ .Values.config.demoTreeForNewUsers | quote }}
  DEFAULT_LANGUAGE: {{ .Values.config.defaultLanguage | quote }}
  MEDIA_ROOT: /data/media
  POSTGRES_HOST: {{ .Values.database.host | quote }}
  POSTGRES_PORT: {{ .Values.database.port | quote }}
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_DB: {{ .Values.database.name | quote }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
