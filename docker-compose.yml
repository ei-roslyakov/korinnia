# Korinnia — production-style stack. Plain HTTP: TLS is terminated by the ingress / load balancer.
# Development overrides: docker-compose.override.yml
# (loaded automatically by `docker compose`; use `-f docker-compose.yml` alone for prod).

name: korinnia

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-korinnia}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-korinnia}
  MEDIA_ROOT: /data/media
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-2048}
  SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
  SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-korinnia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-korinnia}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: korinnia/backend:${KORINNIA_VERSION:-latest}
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    command: ["api"]  # runs `alembic upgrade head` before starting uvicorn
    environment: *backend-env
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: korinnia/backend:${KORINNIA_VERSION:-latest}
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    command: ["worker"]
    environment:
      <<: *backend-env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    volumes:
      - media:/data/media
    healthcheck:
      disable: true
    depends_on:
      backend:  # backend applies migrations (incl. the job queue schema) first
        condition: service_healthy

  nginx:
    image: korinnia/nginx:${KORINNIA_VERSION:-latest}
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NGINX_MAX_BODY_SIZE: ${MAX_UPLOAD_SIZE_MB:-2048}m
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - media:/data/media:ro
    depends_on:
      backend:
        condition: service_healthy


volumes:
  pgdata:
  media:  # all original + derived media files; map to a PVC on Kubernetes
